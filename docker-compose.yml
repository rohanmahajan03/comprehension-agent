services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=comprehension_agent
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=comprehension_agent
    ports:
      # Host port 5433, not 5432 — avoids colliding with a locally-installed Postgres.
      # Bound to loopback only — the default "5433:5432" form publishes on 0.0.0.0, which
      # would let anyone else on the same network reach this dev database using the
      # well-known devpassword credentials above.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates comprehension_agent_test on first init, so the destructive PostgresStore
      # suite has a database of its own and can never truncate the working one.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comprehension_agent -d comprehension_agent"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      target: final
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is in .env (that value is for native/host use,
      # pointing at localhost:5433 — see .env.example). Inside the compose network,
      # `postgres` is reachable by service name on its container-internal port 5432.
      - DATABASE_URL=postgresql+psycopg://comprehension_agent:devpassword@postgres:5432/comprehension_agent
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: prod
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
